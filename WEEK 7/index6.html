<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Flexbox Layout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

    
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: darkblue;
            padding: 20px 40px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-button {
            background-color: white;
            color: darkblue;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

    
        .banner {
            height: 400px;
            background-color: lightblue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 15px;
            padding: 20px;
        }

        .banner h1 {
            color: darkblue;
            font-size: 40px;
        }

        .banner p {
            font-size: 18px;
        }


        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        .course-card {
            flex: 1 1 200px;
            background-color: white;
            border: 2px solid darkblue;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .course-card h2 {
            color: darkblue;
            margin-bottom: 15px;
        }

        .course-card p {
            line-height: 1.6;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">SHUBH</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <button class="nav-button">Login</button>
        </div>

    </nav>

    <section class="banner">

        <h1>Welcome to My Portfolio</h1>

        <p>I am Shubh Kumar, a B.Tech CSE Student.</p>

        <button class="nav-button">Explore More</button>

    </section>

    <section class="cards-container">

        <div class="course-card">
            <h2>HTML</h2>
            <p>Learning the structure of web pages using HTML.</p>
        </div>

        <div class="course-card">
            <h2>CSS</h2>
            <p>Learning styling and layouts using CSS and Flexbox.</p>
        </div>

        <div class="course-card">
            <h2>JavaScript</h2>
            <p>Learning programming and interactive web development.</p>
        </div>

    </section>

</body>
</html>
