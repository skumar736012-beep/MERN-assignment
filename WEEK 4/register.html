<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registration form">
    <meta name="author" content="Shubh Kumar">
    <title>Register - Shubh Kumar</title>
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <header>
        <h1>Registration Form</h1>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <form action="#" method="post">

            <!-- Name -->
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>
            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password"
                   name="password" required>
            <br><br>

            <!-- Date -->
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <!-- Radio Buttons -->
            <p>Gender:</p>

            <input type="radio" id="male"
                   name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female"
                   name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other"
                   name="gender" value="Other">
            <label for="other">Other</label>

            <br><br>

            <!-- Checkboxes -->
            <p>Select Your Interests:</p>

            <input type="checkbox" id="coding"
                   name="interest" value="Coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="cricket"
                   name="interest" value="Cricket">
            <label for="cricket">Cricket</label>

            <input type="checkbox" id="reading"
                   name="interest" value="Reading">
            <label for="reading">Reading</label>

            <br><br>

            <!-- Dropdown -->
            <label for="course">Select Your Course:</label>

            <select id="course" name="course">
                <option value="">Choose Course</option>
                <option value="BTech CSE">B.Tech CSE</option>
                <option value="BTech IT">B.Tech IT</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
            </select>

            <br><br>

            <!-- Message Box -->
            <label for="message">Your Message:</label>
            <br>

            <textarea id="message" name="message"
                      rows="5" cols="30"
                      placeholder="Write your message here"></textarea>

            <br><br>

            <!-- Submit Button -->
            <button type="submit">Submit</button>

        </form>

    </main>

    <footer>
        <p>© 2026 Shubh Kumar</p>
    </footer>

</body>
</html>
