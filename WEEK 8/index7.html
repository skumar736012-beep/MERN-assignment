<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Question 8.3 - Grid Template Areas */
        .page-layout {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 15px;
            padding: 15px;
        }

        .head {
            grid-area: head;
            background-color: #dbeafe;
            padding: 20px;
            text-align: center;
        }

        .side {
            grid-area: side;
            background-color: #fef3c7;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: #f3f4f6;
            padding: 20px;
        }

        .foot {
            grid-area: foot;
            background-color: #dcfce7;
            padding: 20px;
            text-align: center;
        }

        /* Questions 8.1 and 8.2 - Responsive CSS Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .grid-box {
            background-color: #e0e7ff;
            border: 1px solid #6366f1;
            border-radius: 8px;
            padding: 20px;
            font-weight: bold;

            /* Question 8.4 - Flexbox inside Grid */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .grid-icon {
            font-size: 28px;
        }

        /* Responsive layout for mobile */
        @media screen and (max-width: 600px) {
            .page-layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "head"
                    "side"
                    "main"
                    "foot";
            }
        }
    </style>
</head>

<body>

    <div class="page-layout">

        <header class="head">
            <h1>My Learning Dashboard</h1>
        </header>

        <aside class="side">
            <h2>Sidebar</h2>
            <p>Welcome to my CSS Grid project.</p>
        </aside>

        <main class="main">
            <h2>My Technical Skills</h2>

            <div class="grid-container">

                <div class="grid-box">
                    <span class="grid-icon">💻</span>
                    <span>HTML</span>
                </div>

                <div class="grid-box">
                    <span class="grid-icon">🎨</span>
                    <span>CSS</span>
                </div>

                <div class="grid-box">
                    <span class="grid-icon">⚡</span>
                    <span>JavaScript</span>
                </div>

                <div class="grid-box">
                    <span class="grid-icon">☕</span>
                    <span>Java</span>
                </div>

                <div class="grid-box">
                    <span class="grid-icon">🧠</span>
                    <span>DSA</span>
                </div>

                <div class="grid-box">
                    <span class="grid-icon">🤖</span>
                    <span>Artificial Intelligence</span>
                </div>

            </div>
        </main>

        <footer class="foot">
            <p>Created by Shubh | Week 8 CSS Grid Assignment</p>
        </footer>

    </div>

</body>
</html>
