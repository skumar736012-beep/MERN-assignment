<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-bottom: 25px;
        }

    
        .grid-container {
            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

            gap: 20px;
            padding: 20px;
        }

        .grid-box {
            background-color: lightblue;
            border: 2px solid darkblue;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Responsive CSS Grid</h1>

    <div class="grid-container">

        <div class="grid-box">Box 1</div>
        <div class="grid-box">Box 2</div>
        <div class="grid-box">Box 3</div>
        <div class="grid-box">Box 4</div>
        <div class="grid-box">Box 5</div>
        <div class="grid-box">Box 6</div>

    </div>

</body>
</html>
